# Token refresh worker — run on a residential-IP host (Synology NAS).
#
# This compose file does NOT host the website. The website continues to
# live on Railway. This service exists solely to refresh Garmin OAuth
# tokens from an IP that Garmin doesn't rate-limit, then upload them to
# Railway via the existing /admin/upload-garmin-session endpoint.
#
# DEPLOY FOOTPRINT
# ----------------
# The NAS only needs four things (no repo clone, no Dockerfile):
#   1. This file (docker-compose.refresher.yml)
#   2. scripts/refresh_and_push_tokens.py
#   3. .env with RAILWAY_URL + DB_UPLOAD_TOKEN
#   4. data/garmin_sessions/<athlete_id>/oauth1_token.json + oauth2_token.json
#
# The image is plain python:3.11-slim. Dependencies (garth, requests) are
# pip-installed on container start. No build step.
#
# SETUP ON SYNOLOGY (Container Manager → Project → Create):
#   - Project name: garmin-refresher
#   - Path: /volume2/docker/garmin-refresher
#   - Source: docker-compose.refresher.yml (this file)
#   - Start.
#
# Logs: Container Manager → Container → garmin-refresher → Log
#
# Manual run from SSH:
#   cd /volume2/docker/garmin-refresher
#   docker compose -f docker-compose.refresher.yml up -d
#   docker compose -f docker-compose.refresher.yml logs -f garmin-refresher

services:
  garmin-refresher:
    image: python:3.11-slim
    # Install deps then run the worker. Deps cached in /root/.cache between
    # restarts via the named volume below — first start is the only slow one.
    command:
      - sh
      - -c
      - "pip install --no-cache-dir 'garth==0.6.3' 'requests>=2.32.0' && python /app/refresh_and_push_tokens.py"
    restart: unless-stopped
    # Use the NAS's network stack directly. Synology's default Docker
    # bridge network can't resolve external hostnames (DSM uses a local
    # resolver that isn't reachable from the bridge, and outbound UDP/53
    # to public DNS is blocked by the router/ISP). Host networking
    # bypasses both — the container uses the same DNS path that DSM
    # itself uses for package updates. Safe here because the worker
    # only makes outbound HTTPS calls; it binds no ports.
    network_mode: host
    env_file: .env
    environment:
      # Container-side path; overrides any value from .env.
      - GARMIN_SESSION_DIR=/data/garmin_sessions/
      # Refresh every 30 minutes. oauth2 TTL is ~1h so this leaves comfy
      # headroom for one failed tick.
      - REFRESH_INTERVAL_SECONDS=1800
      # Stop pip from showing progress bars in container logs.
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_PROGRESS_BAR=off
    volumes:
      # The script — bind-mounted read-only so you can update it without
      # rebuilding the container (docker compose restart is enough).
      - ./scripts/refresh_and_push_tokens.py:/app/refresh_and_push_tokens.py:ro
      # Token cache. The worker reads + writes oauth1/oauth2 here.
      - ./data:/data
