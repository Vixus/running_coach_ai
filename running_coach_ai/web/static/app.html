      // ── Error Boundary ───────────────────────────────────────────────
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false };
        }
        static getDerivedStateFromError() {
          return { hasError: true };
        }
        render() {
          if (this.state.hasError)
            return (
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  height: "100%",
                  flexDirection: "column",
                  gap: 12,
                  color: "#888",
                }}
              >
                <span style={{ fontSize: 40 }}>⚠️</span>
                <div style={{ fontSize: 16, fontWeight: 600 }}>
                  Something went wrong
                </div>
                <button
                  onClick={() => window.location.reload()}
                  style={{
                    padding: "8px 20px",
                    background: "#5a8a62",
                    color: "#fff",
                    border: "none",
                    borderRadius: 8,
                    cursor: "pointer",
                  }}
                >
                  Reload page
                </button>
              </div>
            );
          return this.props.children;
        }
      }

      // ── Window width hook ────────────────────────────────────────────
      function useWindowWidth() {
        const [w, setW] = useState(window.innerWidth);
        useEffect(() => {
          const handler = () => setW(window.innerWidth);
          window.addEventListener("resize", handler);
          return () => window.removeEventListener("resize", handler);
        }, []);
        return w;
      }

      // ── App ──────────────────────────────────────────────────────────
      function App() {
        const [coach, setCoach] = useState(
          () => localStorage.getItem("rcai_coach") || "classic",
        );
        const [mode, setMode] = useState(
          () => localStorage.getItem("rcai_mode") || "light",
        );
        const [accent, setAccent] = useState(
          () => localStorage.getItem("rcai_accent") || "sage",
        );
        const [screen, setScreen] = useState("dashboard");
        const [athlete, setAthlete] = useState(null);
        const [unread, setUnread] = useState(false);
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const windowWidth = useWindowWidth();
        const isMobile = windowWidth < 768;

        const t = THEMES[mode] || THEMES.light;
        const ac = ACCENTS[accent] || ACCENTS.sage;
        const acMain = mode === "dark" ? ac.dark : ac.main;
        const acAdj = { ...ac, main: acMain };

        useEffect(() => {
          localStorage.setItem("rcai_coach", coach);
        }, [coach]);
        useEffect(() => {
          localStorage.setItem("rcai_mode", mode);
        }, [mode]);
        useEffect(() => {
          localStorage.setItem("rcai_accent", accent);
        }, [accent]);

        function toggleMode() {
          setMode((m) => (m === "light" ? "dark" : "light"));
        }

        function markChatRead() {
          setUnread(false);
          localStorage.setItem("rcai_chat_last_read", new Date().toISOString());
        }

        function handleSetScreen(id) {
          setScreen(id);
          if (id === "chat") markChatRead();
        }

        useEffect(() => {
          apiFetch("/api/dashboard")
            .then((r) => r?.json())
            .then((d) => {
              if (d?.athlete) setAthlete(d.athlete);
            })
            .catch(() => {});
        }, []);

        useEffect(() => {
          apiFetch("/api/chat/history")
            .then((r) => r?.json())
            .then((d) => {
              const msgs = d?.messages;
              if (!msgs?.length) return;
              const latest = [...msgs]
                .reverse()
                .find((m) => m.role === "assistant");
              if (!latest?.timestamp) return;
              const lastRead = localStorage.getItem("rcai_chat_last_read");
              if (!lastRead || new Date(latest.timestamp) > new Date(lastRead))
                setUnread(true);
            })
            .catch(() => {});
        }, []);

        const screens = {
          dashboard: <Dashboard coach={coach} />,
          plan: <TrainingPlan />,
          activities: <ActivityFeed />,
          chat: <CoachChat coach={coach} mini={false} />,
          review: <WeeklyReview />,
          admin: <Admin />,
          onboarding: <Onboarding />,
        };

        const BOTTOM_NAV = [
          { id: "dashboard", label: "Dashboard", icon: NAV_ICONS.dashboard },
          { id: "plan", label: "Plan", icon: NAV_ICONS.plan },
          { id: "activities", label: "Activity", icon: NAV_ICONS.activities },
          { id: "chat", label: "Chat", icon: NAV_ICONS.chat },
        ];

        if (isMobile) {
          return (
            <ThemeCtx.Provider
              value={{ t, ac: acAdj, mode, accent, setAccent }}
            >
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  height: "100%",
                  background: t.bg,
                  color: t.text,
                }}
              >
                {/* Mobile top header */}
                <div
                  style={{
                    height: 48,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    padding: "0 12px",
                    background: t.sidebar,
                    borderBottom: `1px solid ${t.border}`,
                    flexShrink: 0,
                    zIndex: 100,
                  }}
                >
                  <button
                    onClick={() => setSidebarOpen(true)}
                    style={{
                      width: 36,
                      height: 36,
                      border: "none",
                      background: "none",
                      cursor: "pointer",
                      color: t.text,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 20,
                    }}
                  >
                    ☰
                  </button>
                  <div
                    style={{
                      fontWeight: 700,
                      fontSize: 15,
                      color: t.text,
                      letterSpacing: "-0.01em",
                    }}
                  >
                    RunCoach AI
                  </div>
                  <button
                    onClick={toggleMode}
                    style={{
                      width: 36,
                      height: 36,
                      border: `1px solid ${t.border}`,
                      background: t.surface,
                      borderRadius: 8,
                      cursor: "pointer",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 14,
                    }}
                  >
                    {mode === "light" ? "🌙" : "☀️"}
                  </button>
                </div>
                {/* Sidebar overlay */}
                {sidebarOpen && (
                  <div
                    className="sidebar-overlay"
                    onClick={() => setSidebarOpen(false)}
                  >
                    <div
                      onClick={(e) => e.stopPropagation()}
                      style={{
                        position: "fixed",
                        left: 0,
                        top: 0,
                        height: "100%",
                        width: 280,
                        zIndex: 300,
                        background: t.sidebar,
                        animation: "slideIn 0.22s ease",
                        display: "flex",
                        flexDirection: "column",
                      }}
                    >
                      <div
                        style={{
                          padding: "14px 16px 10px",
                          borderBottom: `1px solid ${t.border}`,
                          display: "flex",
                          justifyContent: "space-between",
                          alignItems: "center",
                        }}
                      >
                        <div
                          style={{
                            fontWeight: 700,
                            fontSize: 14,
                            color: t.text,
                          }}
                        >
                          Menu
                        </div>
                        <button
                          onClick={() => setSidebarOpen(false)}
                          style={{
                            width: 30,
                            height: 30,
                            border: "none",
                            background: "none",
                            cursor: "pointer",
                            color: t.textMuted,
                            fontSize: 20,
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                          }}
                        >
                          ×
                        </button>
                      </div>
                      <Sidebar
                        screen={screen}
                        setScreen={(id) => {
                          handleSetScreen(id);
                          setSidebarOpen(false);
                        }}
                        athlete={athlete}
                        coach={coach}
                        setCoach={setCoach}
                        mode={mode}
                        toggleMode={toggleMode}
                        unread={unread}
                        embedded={true}
                      />
                    </div>
                  </div>
                )}
                {/* Main content */}
                <div
                  style={{
                    flex: 1,
                    overflowY: "auto",
                    display: "flex",
                    flexDirection: "column",
                    paddingBottom: 60,
                  }}
                >
                  <ErrorBoundary>
                    {screens[screen] ?? (
                      <EmptyState icon="🔍" title="Screen not found" desc="" />
                    )}
                  </ErrorBoundary>
                </div>
                {/* Bottom nav */}
                <div
                  style={{
                    position: "fixed",
                    bottom: 0,
                    left: 0,
                    right: 0,
                    height: 60,
                    background: t.sidebar,
                    borderTop: `1px solid ${t.border}`,
                    display: "flex",
                    zIndex: 200,
                  }}
                >
                  {BOTTOM_NAV.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => {
                        if (item.id === "chat") {
                          handleSetScreen("chat");
                        } else handleSetScreen(item.id);
                      }}
                      style={{
                        flex: 1,
                        border: "none",
                        background:
                          screen === item.id ? acAdj.soft : "transparent",
                        cursor: "pointer",
                        display: "flex",
                        flexDirection: "column",
                        alignItems: "center",
                        justifyContent: "center",
                        gap: 3,
                        color: screen === item.id ? acAdj.main : t.textMuted,
                        fontSize: 10,
                        fontWeight: screen === item.id ? 600 : 400,
                      }}
                    >
                      <span style={{ display: "flex", alignItems: "center" }}>
                        {item.icon}
                      </span>
                      {item.label}
                      {item.id === "chat" && unread && (
                        <div
                          style={{
                            position: "absolute",
                            width: 6,
                            height: 6,
                            borderRadius: "50%",
                            background: "#5a8a62",
                            marginLeft: 12,
                            marginBottom: 10,
                          }}
                        />
                      )}
                    </button>
                  ))}
                </div>
                <FloatingCoach
                  coach={coach}
                  unread={unread}
                  markChatRead={markChatRead}
                />
              </div>
            </ThemeCtx.Provider>
          );
        }

        return (
          <ThemeCtx.Provider value={{ t, ac: acAdj, mode, accent, setAccent }}>
            <div
              style={{
                display: "flex",
                height: "100%",
                background: t.bg,
                transition: "background 0.3s",
                color: t.text,
              }}
            >
              <Sidebar
                screen={screen}
                setScreen={handleSetScreen}
                athlete={athlete}
                coach={coach}
                setCoach={setCoach}
                mode={mode}
                toggleMode={toggleMode}
                unread={unread}
              />
              <div
                style={{
                  flex: 1,
                  overflow: "hidden",
                  display: "flex",
                  flexDirection: "column",
                }}
              >
                <ErrorBoundary>
                  {screens[screen] ?? (
                    <EmptyState icon="🔍" title="Screen not found" desc="" />
                  )}
                </ErrorBoundary>
              </div>
              <FloatingCoach
                coach={coach}
                unread={unread}
                markChatRead={markChatRead}
              />
            </div>
          </ThemeCtx.Provider>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
