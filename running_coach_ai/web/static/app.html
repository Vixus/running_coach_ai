<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Running Coach AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(120, 100, 70, 0.2);
        border-radius: 4px;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes drawLine {
        from {
          stroke-dashoffset: 800;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes barRise {
        from {
          transform: scaleY(0);
        }
        to {
          transform: scaleY(1);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes coachPulse {
        0%,
        100% {
          box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.25),
            0 0 0 0 rgba(120, 120, 120, 0.3);
        }
        60% {
          box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.25),
            0 0 0 10px transparent;
        }
      }
      @keyframes slideIn {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }
      @media (max-width: 767px) {
        html,
        body,
        #root {
          overflow: auto;
        }
        .sidebar-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.4);
          z-index: 299;
        }
      }
      input,
      button,
      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {
        useState,
        useEffect,
        useLayoutEffect,
        useContext,
        createContext,
        useRef,
      } = React;

      // ── Color System ────────────────────────────────────────────────
      const ACCENTS = {
        sage: {
          main: "#5a8a62",
          soft: "rgba(90,138,98,0.12)",
          dark: "#72a87a",
          label: "Sage",
        },
        terracotta: {
          main: "#b8673e",
          soft: "rgba(184,103,62,0.12)",
          dark: "#d07f58",
          label: "Terracotta",
        },
        stone: {
          main: "#5e7e96",
          soft: "rgba(94,126,150,0.12)",
          dark: "#7899b0",
          label: "Stone",
        },
      };

      const THEMES = {
        light: {
          bg: "#f2ede6",
          surface: "#faf8f4",
          surface2: "#f5f1ea",
          sidebar: "#ede8df",
          border: "rgba(80,60,30,0.1)",
          borderSoft: "rgba(80,60,30,0.06)",
          text: "#1f1c16",
          textMid: "#5a5040",
          textMuted: "#6e6254",
          textDim: "#c0b8aa",
          inputBg: "#ffffff",
          shadow:
            "0 1px 3px rgba(80,60,20,0.08), 0 4px 16px rgba(80,60,20,0.04)",
        },
        dark: {
          bg: "#1c1a15",
          surface: "#242118",
          surface2: "#2c291f",
          sidebar: "#1e1c16",
          border: "rgba(255,240,200,0.08)",
          borderSoft: "rgba(255,240,200,0.05)",
          text: "#ede8df",
          textMid: "#b0a890",
          textMuted: "#8c8272",
          textDim: "#4a4538",
          inputBg: "#2c291f",
          shadow: "0 1px 4px rgba(0,0,0,0.3)",
        },
      };

      const COACH_META = {
        classic: {
          name: "Coach Alex",
          style: "Elite · Data-Driven",
          color: "#5e7e96",
          initials: "A",
          bio: "Former Olympic Trials qualifier. Physiological periodization and peak race performance.",
        },
        maya: {
          name: "Coach Maya",
          style: "Consistency-First",
          color: "#5a8a62",
          initials: "M",
          bio: "USAT certified, 12 years coaching. Steady habits compound over heroic weeks.",
        },
        jordan: {
          name: "Coach Jordan",
          style: "Resilience · Injury-Free",
          color: "#b8673e",
          initials: "J",
          bio: "PT-turned-running-coach. Load management, biomechanics, and longevity.",
        },
      };

      // ── Context ─────────────────────────────────────────────────────
      const ThemeCtx = createContext({
        t: THEMES.light,
        ac: ACCENTS.sage,
        mode: "light",
      });
      const useTh = () => useContext(ThemeCtx);

      // ── API Helper ──────────────────────────────────────────────────
      function apiFetch(url, opts = {}) {
        return fetch(url, { credentials: "same-origin", ...opts }).then((r) => {
          if (r.status === 401) {
            window.location.href = "/login";
            return null;
          }
          return r;
        });
      }

      // ── Primitives ──────────────────────────────────────────────────
      const Card = ({ children, style, onClick }) => {
        const { t } = useTh();
        return (
          <div
            onClick={onClick}
            style={{
              background: t.surface,
              border: `1px solid ${t.border}`,
              borderRadius: 12,
              padding: 18,
              boxShadow: t.shadow,
              cursor: onClick ? "pointer" : "default",
              transition: "background 0.2s",
              ...style,
            }}
          >
            {children}
          </div>
        );
      };

      const Label = ({ children, style }) => {
        const { t } = useTh();
        return (
          <div
            style={{
              fontSize: 12,
              fontWeight: 600,
              letterSpacing: "0.07em",
              textTransform: "uppercase",
              color: t.textMuted,
              marginBottom: 10,
              ...style,
            }}
          >
            {children}
          </div>
        );
      };

      const Badge = ({ children, color }) => (
        <span
          style={{
            background: color + "22",
            color,
            borderRadius: 6,
            padding: "2px 9px",
            fontSize: 12,
            fontWeight: 600,
          }}
        >
          {children}
        </span>
      );

      const MetricCard = ({ label, value, unit, sub, color, trend }) => {
        const { t } = useTh();
        return (
          <Card>
            <Label>{label}</Label>
            <div style={{ display: "flex", alignItems: "baseline", gap: 5 }}>
              <span
                style={{
                  fontSize: 30,
                  fontWeight: 600,
                  color: color || t.text,
                  letterSpacing: "-0.03em",
                }}
              >
                {value ?? "—"}
              </span>
              {unit && (
                <span style={{ fontSize: 13, color: t.textMuted }}>{unit}</span>
              )}
            </div>
            {sub && (
              <div style={{ fontSize: 12, color: t.textMuted, marginTop: 4 }}>
                {sub}
              </div>
            )}
            {trend != null && (
              <div
                style={{
                  fontSize: 12,
                  marginTop: 5,
                  color: trend >= 0 ? "#5a8a62" : "#c05040",
                }}
              >
                {trend >= 0 ? "↑" : "↓"} {Math.abs(trend)} vs last week
              </div>
            )}
          </Card>
        );
      };

      // Tooltip primitive
      const Tip = ({ children, content, width: tipW = 180, pos = "top" }) => {
        const { t } = useTh();
        const [show, setShow] = useState(false);
        const [coords, setCoords] = useState(null);
        const ref = useRef(null);
        if (!content) return <>{children}</>;
        const isTop = pos !== "bottom";
        function handleEnter() {
          if (ref.current) {
            const r = ref.current.getBoundingClientRect();
            setCoords({
              cx: r.left + r.width / 2,
              top: r.top,
              bottom: r.bottom,
            });
          }
          setShow(true);
        }
        return (
          <div
            ref={ref}
            style={{ position: "relative", display: "inline-block" }}
            onMouseEnter={handleEnter}
            onMouseLeave={() => setShow(false)}
          >
            {children}
            {show && coords && (
              <div
                style={{
                  position: "fixed",
                  left: Math.min(
                    Math.max(coords.cx - tipW / 2, 8),
                    window.innerWidth - tipW - 8,
                  ),
                  ...(isTop
                    ? { top: coords.top - 8, transform: "translateY(-100%)" }
                    : { top: coords.bottom + 8 }),
                  background: t.surface,
                  border: `1px solid ${t.border}`,
                  borderRadius: 9,
                  padding: "9px 12px",
                  width: tipW,
                  zIndex: 1000,
                  boxShadow: t.shadow,
                  pointerEvents: "none",
                  animation: "fadeIn 0.12s ease",
                }}
              >
                {content}
                <div
                  style={{
                    position: "absolute",
                    ...(isTop ? { bottom: -4 } : { top: -4 }),
                    left: "50%",
                    transform: "translateX(-50%) rotate(45deg)",
                    width: 7,
                    height: 7,
                    background: t.surface,
                    border: `1px solid ${t.border}`,
                    ...(isTop
                      ? { borderTop: "none", borderLeft: "none" }
                      : { borderBottom: "none", borderRight: "none" }),
                  }}
                />
              </div>
            )}
          </div>
        );
      };

      // ── Zone Bars ────────────────────────────────────────────────────
      const ZONE_DEFS = [
        {
          name: "Zone 1",
          label: "Recovery",
          range: "< 60% HRmax",
          desc: "Active recovery. Flushes lactate, minimal training stress.",
        },
        {
          name: "Zone 2",
          label: "Aerobic",
          range: "60–70% HRmax",
          desc: "The aerobic engine room. Fat oxidation, mitochondrial growth, the base of your fitness.",
        },
        {
          name: "Zone 3",
          label: "Tempo",
          range: "70–80% HRmax",
          desc: "Aerobic threshold. Improves sustainable race pace. Use sparingly.",
        },
        {
          name: "Zone 4",
          label: "Threshold",
          range: "80–90% HRmax",
          desc: "Lactate threshold. Raises your ceiling and makes race pace feel easier over time.",
        },
        {
          name: "Zone 5",
          label: "VO2max",
          range: "90–100% HRmax",
          desc: "Maximum intensity. Short efforts that raise your aerobic ceiling.",
        },
      ];
      const ZONE_COLS = ["#5e7e96", "#5a8a62", "#d4a044", "#b8673e", "#c05040"];

      const ZoneBars = ({ zones, compact, duration }) => {
        const { t } = useTh();
        const ZL = ["Z1", "Z2", "Z3", "Z4", "Z5"];
        const totalMins = duration
          ? (() => {
              const p = duration.split(":").map(Number);
              return p.length === 3
                ? p[0] * 60 + p[1] + p[2] / 60
                : p[0] * 60 + p[1];
            })()
          : null;

        return (
          <div>
            <div
              style={{
                display: "flex",
                height: compact ? 7 : 10,
                borderRadius: 4,
                overflow: "hidden",
              }}
            >
              {zones.map(
                (z, i) =>
                  z > 0 &&
                  (compact ? (
                    <div
                      key={i}
                      style={{ width: `${z}%`, background: ZONE_COLS[i] }}
                    />
                  ) : (
                    <Tip
                      key={i}
                      width={200}
                      content={
                        <div>
                          <div
                            style={{
                              display: "flex",
                              justifyContent: "space-between",
                              marginBottom: 5,
                            }}
                          >
                            <span
                              style={{
                                fontWeight: 700,
                                fontSize: 12,
                                color: ZONE_COLS[i],
                              }}
                            >
                              {ZL[i]} · {ZONE_DEFS[i].label}
                            </span>
                            <span
                              style={{
                                fontSize: 12,
                                fontWeight: 600,
                                color: t.text,
                              }}
                            >
                              {z}%
                            </span>
                          </div>
                          <div
                            style={{
                              fontSize: 11,
                              color: t.textMuted,
                              marginBottom: totalMins ? 6 : 0,
                            }}
                          >
                            {ZONE_DEFS[i].range}
                          </div>
                          {totalMins && (
                            <div
                              style={{
                                fontSize: 11,
                                color: t.textMid,
                                marginBottom: 5,
                              }}
                            >
                              {Math.round((totalMins * z) / 100)} min in this
                              zone
                            </div>
                          )}
                          <div
                            style={{
                              fontSize: 11,
                              color: t.textMuted,
                              lineHeight: 1.5,
                              borderTop: `1px solid ${t.borderSoft}`,
                              paddingTop: 6,
                              marginTop: 4,
                            }}
                          >
                            {ZONE_DEFS[i].desc}
                          </div>
                        </div>
                      }
                    >
                      <div
                        style={{
                          width: `${z}%`,
                          height: 10,
                          background: ZONE_COLS[i],
                          cursor: "default",
                        }}
                      />
                    </Tip>
                  )),
              )}
            </div>
            {!compact && (
              <div
                style={{
                  display: "flex",
                  gap: 10,
                  marginTop: 8,
                  flexWrap: "wrap",
                }}
              >
                {zones.map(
                  (z, i) =>
                    z > 0 && (
                      <span key={i} style={{ fontSize: 11 }}>
                        <span style={{ color: ZONE_COLS[i] }}>● </span>
                        <span style={{ opacity: 0.7 }}>
                          {ZL[i]} {z}%
                        </span>
                      </span>
                    ),
                )}
              </div>
            )}
          </div>
        );
      };

      // ── Charts ───────────────────────────────────────────────────────
      const WeekTooltip = ({ d, color }) => {
        const { t } = useTh();
        if (!d) return null;
        return (
          <div
            style={{
              background: t.surface,
              border: `1px solid ${t.border}`,
              borderRadius: 12,
              padding: "14px 15px",
              width: 220,
              boxShadow: "0 8px 32px rgba(0,0,0,0.15)",
              pointerEvents: "none",
              animation: "fadeIn 0.15s ease",
            }}
          >
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "baseline",
                marginBottom: 10,
              }}
            >
              <div style={{ fontWeight: 700, fontSize: 13, color: t.text }}>
                {d.label}
              </div>
              <div
                style={{
                  fontSize: 18,
                  fontWeight: 700,
                  color,
                  letterSpacing: "-0.02em",
                }}
              >
                {d.value}{" "}
                <span
                  style={{ fontSize: 11, fontWeight: 400, color: t.textMuted }}
                >
                  {d.unit || "mi"}
                </span>
              </div>
            </div>
            {d.stats && (
              <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                {d.stats.map((s, i) => (
                  <div
                    key={i}
                    style={{
                      flex: 1,
                      background: t.surface2,
                      borderRadius: 7,
                      padding: "6px 8px",
                    }}
                  >
                    <div
                      style={{
                        fontSize: 10,
                        color: t.textMuted,
                        marginBottom: 2,
                      }}
                    >
                      {s.label}
                    </div>
                    <div
                      style={{
                        fontSize: 14,
                        fontWeight: 600,
                        color: s.color || t.text,
                      }}
                    >
                      {s.value}
                    </div>
                  </div>
                ))}
              </div>
            )}
            {d.items && d.items.length > 0 && (
              <div style={{ marginBottom: 8 }}>
                {d.items.map((r, i) => (
                  <div
                    key={i}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontSize: 11,
                      color: t.textMuted,
                      padding: "3px 0",
                      borderBottom: `1px solid ${t.borderSoft}`,
                    }}
                  >
                    <span>{r.day}</span>
                    <span style={{ color: t.textMid }}>{r.desc}</span>
                    {r.value && (
                      <span style={{ fontWeight: 500 }}>{r.value}</span>
                    )}
                  </div>
                ))}
              </div>
            )}
            {d.note && (
              <div
                style={{
                  fontSize: 11,
                  color: t.textMid,
                  lineHeight: 1.55,
                  fontStyle: "italic",
                  borderTop: `1px solid ${t.borderSoft}`,
                  paddingTop: 8,
                }}
              >
                "{d.note}"
              </div>
            )}
          </div>
        );
      };

      const LineChart = ({
        data = [],
        labels = [],
        color = "#5a8a62",
        width = 260,
        height = 80,
        tooltips,
      }) => {
        const { t } = useTh();
        const [hov, setHov] = useState(null);
        if (!data.length) return null;
        const min = Math.min(...data) - 2,
          max = Math.max(...data, min + 1),
          range = max - min + 1;
        const pts = data.map((v, i) => [
          (i / (data.length - 1 || 1)) * (width - 8) + 4,
          height - 8 - ((v - min) / range) * (height - 20) + 4,
        ]);
        const pathD = pts
          .map(
            (p, i) =>
              `${i === 0 ? "M" : "L"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`,
          )
          .join(" ");
        const area =
          pathD +
          ` L${pts[pts.length - 1][0]} ${height} L${pts[0][0]} ${height} Z`;
        const uid = `lg_${color.replace(/[^a-z0-9]/gi, "")}`;
        const tipLeft =
          hov !== null
            ? Math.min(Math.max(pts[hov][0] - 48, 0), width - 110)
            : 0;
        return (
          <div
            style={{
              position: "relative",
              display: "inline-block",
              width,
              height,
            }}
          >
            <svg
              width={width}
              height={height}
              style={{ display: "block", overflow: "visible" }}
            >
              <defs>
                <linearGradient id={uid} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={color} stopOpacity="0.2" />
                  <stop offset="100%" stopColor={color} stopOpacity="0" />
                </linearGradient>
              </defs>
              <path d={area} fill={`url(#${uid})`} />
              <path
                d={pathD}
                stroke={color}
                strokeWidth="2"
                fill="none"
                strokeLinecap="round"
                strokeLinejoin="round"
                strokeDasharray="800"
                strokeDashoffset="800"
                style={{ animation: "drawLine 1.2s ease forwards" }}
              />
              {hov !== null && (
                <line
                  x1={pts[hov][0]}
                  y1={4}
                  x2={pts[hov][0]}
                  y2={height - 16}
                  stroke={color}
                  strokeWidth="1"
                  strokeOpacity="0.3"
                  strokeDasharray="3,2"
                />
              )}
              {pts.map((p, i) => (
                <g
                  key={i}
                  onMouseEnter={() => setHov(i)}
                  onMouseLeave={() => setHov(null)}
                  style={{ cursor: "default" }}
                >
                  <circle
                    cx={p[0]}
                    cy={p[1]}
                    r={hov === i ? 5 : i === pts.length - 1 ? 3.5 : 1.5}
                    fill={color}
                    opacity={i === pts.length - 1 || hov === i ? 1 : 0.5}
                    style={{ transition: "r 0.12s" }}
                  />
                  <circle cx={p[0]} cy={p[1]} r={14} fill="transparent" />
                </g>
              ))}
            </svg>
            {labels.length > 0 && (
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  marginTop: 2,
                }}
              >
                {[
                  labels[0],
                  labels[Math.floor(labels.length / 2)],
                  labels[labels.length - 1],
                ].map((l, i) => (
                  <span key={i} style={{ fontSize: 9, color: t.textMuted }}>
                    {l}
                  </span>
                ))}
              </div>
            )}
            {hov !== null && (
              <div
                style={{
                  position: "absolute",
                  left: tipLeft,
                  top: Math.max(pts[hov][1] - 58, -4),
                  background: t.surface,
                  border: `1px solid ${t.border}`,
                  borderRadius: 8,
                  padding: "7px 10px",
                  fontSize: 12,
                  pointerEvents: "none",
                  zIndex: 20,
                  boxShadow: t.shadow,
                  whiteSpace: "nowrap",
                  animation: "fadeIn 0.1s ease",
                }}
              >
                <div style={{ fontWeight: 700, color, marginBottom: 2 }}>
                  {data[hov]}
                </div>
                {tooltips?.[hov] && (
                  <div style={{ color: t.textMuted, fontSize: 11 }}>
                    {tooltips[hov]}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      const BarChart = ({
        data = [],
        labels = [],
        color = "#5a8a62",
        width = 260,
        height = 80,
        weekData,
      }) => {
        const { t } = useTh();
        const [hov, setHov] = useState(null);
        const max = Math.max(...data) || 1;
        const bw = width / data.length - 4;
        return (
          <div
            style={{
              position: "relative",
              display: "inline-block",
              width,
              height,
            }}
          >
            <svg width={width} height={height} style={{ display: "block" }}>
              {data.map((v, i) => {
                const bh = Math.max(3, (v / max) * (height - 20));
                const x = i * (width / data.length) + 2;
                return (
                  <g
                    key={i}
                    onMouseEnter={() => setHov(i)}
                    onMouseLeave={() => setHov(null)}
                    style={{ cursor: "default" }}
                  >
                    <rect
                      x={x}
                      y={height - 20 - bh}
                      width={bw}
                      height={bh}
                      rx="4"
                      fill={
                        hov === i
                          ? color
                          : i === data.length - 1
                            ? color
                            : color + "60"
                      }
                      opacity={hov === i ? 1 : i === data.length - 1 ? 1 : 0.75}
                      style={{
                        transformOrigin: `${x + bw / 2}px ${height - 20}px`,
                        animation: `barRise 0.7s ${i * 0.07}s ease both`,
                        transition: "fill 0.15s, opacity 0.15s",
                      }}
                    />
                    <rect
                      x={x - 2}
                      y={0}
                      width={bw + 4}
                      height={height}
                      fill="transparent"
                    />
                    {labels[i] && (
                      <text
                        x={x + bw / 2}

                  Math.max(x + bw / 2 - tipW / 2, 0),

                  <div
                    style={{
                      position: "absolute",
                      left,
                      bottom: height + 8,
                      zIndex: 30,

      // ── Training Plan ────────────────────────────────────────────────
      function TrainingPlan() {
        const { t, ac } = useTh();
        const [data, setData] = useState(null);
        const [month, setMonth] = useState(() => {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        });
        const [selected, setSelected] = useState(null);
        const [syncing, setSyncing] = useState(false);
        const [syncResult, setSyncResult] = useState(null);
        const [loading, setLoading] = useState(true);
        const [lastSync, setLastSync] = useState(
          () => localStorage.getItem("garmin_last_sync") || null,
        );
        const [, forceUpdate] = React.useReducer((x) => x + 1, 0);

        useEffect(() => {
          setLoading(true);
          apiFetch(`/api/plan?month=${month}`)
            .then((r) => r?.json())
            .then((d) => {
              if (d) setData(d);
            })
            .finally(() => setLoading(false));
        }, [month]);

        useEffect(() => {
          const id = setInterval(forceUpdate, 60000);
          return () => clearInterval(id);
        }, []);

        function prevMonth() {
          const [y, m] = month.split("-").map(Number);
          const d = new Date(y, m - 2, 1);
          setMonth(
            `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
          );
        }
        function nextMonth() {
          const [y, m] = month.split("-").map(Number);
          const d = new Date(y, m, 1);
          setMonth(
            `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
          );
        }

        async function handleSync() {
          setSyncing(true);
          setSyncResult(null);
          try {
            const r = await apiFetch("/api/plan/sync", { method: "POST" });
            const d = await r.json();
            setSyncResult(d);
            if (d?.ok) {
              const ts = new Date().toISOString();
              localStorage.setItem("garmin_last_sync", ts);
              setLastSync(ts);
            }
          } catch {
            setSyncResult({ ok: false, error: "Network error" });
          }
          setSyncing(false);
        }

        if (loading)
          return (
            <div
              style={{
                padding: 40,
                color: t.textMuted,
                animation: "fadeUp 0.3s ease",

            >

          tempo: "#b8673e",
          intervals: "#c05040",

          race: "#c4a040",

          tempo: "⚡",
          intervals: "🎯",
          strides: "💨",

          rest: "🛌",
          race: "🏆",

          "",

              height: "100%",

                        fontSize: 13,

      // ── Activity Feed ────────────────────────────────────────────────
      function ActivityFeed() {
        const { t, ac } = useTh();
        const [data, setData] = useState(null);
        const [expanded, setExpanded] = useState({});
        const [feedback, setFeedback] = useState({});
        const [loading, setLoading] = useState(true);
        const [weekOffset, setWeekOffset] = useState(0);

        function getWeekStartStr(offset) {
          const d = new Date();
          d.setHours(0, 0, 0, 0);
          d.setDate(d.getDate() - ((d.getDay() + 6) % 7) - offset * 7);
          return d.toISOString().split("T")[0];
        }

        useEffect(() => {
          setLoading(true);
          apiFetch(`/api/activities?week_start=${getWeekStartStr(weekOffset)}`)
            .then((r) => r?.json())
            .then((d) => {
              if (d) setData(d);
            })
            .finally(() => setLoading(false));
        }, [weekOffset]);

        const setFb = (id, key, val) =>
          setFeedback((f) => ({
            ...f,
            [id]: { ...(f[id] || {}), [key]: val },
          }));
        const saveFb = async (id) => {
          try {
            const fb = feedback[id] || {};
            const payload = {
              feel_score: fb.feel,
              rpe: fb.rpe,
              notes: fb.notes,
            };
            await apiFetch(`/api/activities/${id}/feedback`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            setFeedback((f) => ({
              ...f,
              [id]: { ...(f[id] || {}), saved: true },
            }));
          } catch {}
        };

        const FEELS = ["😴", "😕", "😐", "🙂", "🔥"];
        const FEEL_LABELS = ["Dead", "Rough", "OK", "Good", "Strong"];

        const { summary, activities } = data || {};

        const weekLabel = (() => {
          if (weekOffset === 0) return "This Week";
          if (summary?.week_start && summary?.week_end) {
            const s = new Date(summary.week_start + "T00:00:00");
            const e = new Date(summary.week_end + "T00:00:00");
            return `${s.toLocaleDateString([], { month: "short", day: "numeric" })}–${e.toLocaleDateString([], { month: "short", day: "numeric" })}`;
          }
          return `${weekOffset}w ago`;
        })();

        return (
          <div
            style={{
              overflowY: "auto",
              height: "100%",
              padding: "28px 32px",
              animation: "fadeUp 0.3s ease",
              color: t.text,
            }}
          >
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "flex-start",
                marginBottom: 24,
              }}
            >
              <div>
                <div
                  style={{
                    fontSize: 26,
                    fontWeight: 600,
                    letterSpacing: "-0.02em",
                  }}
                >
                  Activity Feed
                </div>
                <div style={{ fontSize: 14, color: t.textMuted, marginTop: 4 }}>
                  Post-run analysis · delivered within 10 min of completion
                </div>
              </div>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  marginTop: 6,
                }}
              >
                <a
                  href="/magazine"
                  target="_blank"
                  rel="noopener"
                  title="Open your personalized training magazine in a new tab"
                  style={{
                    background: ac.main,
                    color: "#0f0f0f",
                    border: `1px solid ${ac.main}`,
                    borderRadius: 999,
                    padding: "6px 14px",
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer",
                    textDecoration: "none",
                    display: "inline-flex",
                    alignItems: "center",
                    gap: 6,
                    marginRight: 8,
                  }}
                >
                  <span style={{ fontSize: 14, lineHeight: 1 }}>✦</span>
                  Magazine View
                </a>
                <button
                  onClick={() => setWeekOffset((o) => o + 1)}
                  style={{
                    background: t.surface2,
                    border: `1px solid ${t.border}`,
                    borderRadius: 8,
                    padding: "6px 12px",
                    fontSize: 13,
                    color: t.text,
                    cursor: "pointer",
                  }}
                >
                  ← Prev
                </button>
                <span
                  style={{
                    fontSize: 13,
                    fontWeight: 500,
                    color: t.text,
                    minWidth: 100,
                    textAlign: "center",
                  }}
                >
                  {weekLabel}
                </span>
                <button
                  onClick={() => setWeekOffset((o) => Math.max(0, o - 1))}
                  disabled={weekOffset === 0}
                  style={{
                    background: t.surface2,
                    border: `1px solid ${t.border}`,
                    borderRadius: 8,
                    padding: "6px 12px",
                    fontSize: 13,
                    color: t.text,
                    cursor: weekOffset === 0 ? "default" : "pointer",
                    opacity: weekOffset === 0 ? 0.4 : 1,
                  }}
                >
                  Next →
                </button>
              </div>
            </div>

            {loading && (
              <div style={{ color: t.textMuted, padding: "16px 0" }}>
                Loading activities…
              </div>
            )}

            {!loading && summary && (
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(4,1fr)",
                  gap: 12,
                  marginBottom: 24,
                }}
              >
                <MetricCard
                  label={weekLabel}
                  value={summary.week_miles?.toFixed(1)}
                  unit="mi"
                  color={ac.main}
                />
                <MetricCard
                  label="YTD Miles"
                  value={summary.ytd_miles?.toFixed(0)}
                  unit="mi"
                />
                <MetricCard
                  label="Avg Pace"
                  value={summary.avg_pace_7d}
                  unit="/mi"
                  sub="7-day rolling"
                />
                <MetricCard
                  label="Training Load"
                  value={summary.training_load}
                  color="#b8673e"
                />
              </div>
            )}

            {!loading && !activities?.length && (
              <EmptyState
                icon="🏃"
                title="No activities yet"
                desc="Completed runs will appear here after your first Garmin sync."
              />
            )}

            {(activities || []).map((act) => {
              const open = expanded[act.id];
              const fb = feedback[act.id] || {
                feel: act.feedback?.feel_score,
                rpe: act.feedback?.rpe,
                notes: act.feedback?.notes || "",

              return (
                <Card
                  key={act.id}
                  style={{ marginBottom: 10 }}
                  onClick={() =>
                    setExpanded((v) => ({ ...v, [act.id]: !v[act.id] }))
                  }
                >
                  <div
                    style={{ display: "flex", gap: 14, alignItems: "center" }}
                  >
                    <div
                      style={{
                        width: 48,
                        height: 48,
                        borderRadius: 13,
                        background: ac.soft,
                        border: `1px solid ${ac.main}30`,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontSize: 22,
                        flexShrink: 0,
                      }}
                    >
                      🏃
                    </div>
                    <div style={{ flex: 1 }}>
                      <div
                        style={{
                          display: "flex",
                          justifyContent: "space-between",
                          marginBottom: 5,

                        <div style={{ fontWeight: 600, fontSize: 16 }}>
                          {act.label}
                        </div>
                        <div style={{ fontSize: 13, color: t.textMuted }}>
                          {act.date}
                        </div>
                      </div>
                      <div
                        style={{

                          gap: 18,
                          fontSize: 13,
                          color: t.textMid,

                        {act.is_time_based
                          ? act.duration && (
                              <span style={{ fontWeight: 500 }}>
                                {act.duration}
                              </span>
                            )

                              <span style={{ fontWeight: 500 }}>

                        {act.avg_pace && <span>{act.avg_pace}/mi</span>}
                        {act.avg_hr && <span>Avg {act.avg_hr} bpm</span>}
                      </div>
                      {act.hr_zones && (
                        <ZoneBars zones={act.hr_zones} compact />

                    </div>
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 16 16"

                      style={{
                        transform: open ? "rotate(180deg)" : "none",
                        transition: "0.2s",

                    >
                      <path

                  </div>

                  {open && (
                    <div
                      onClick={(e) => e.stopPropagation()}

                        marginTop: 18,

                        borderTop: `1px solid ${t.borderSoft}`,
                        animation: "fadeIn 0.2s ease",

                    >
                      <div
                        style={{
                          display: "grid",
                          gridTemplateColumns: "1fr 1fr",
                          gap: 14,
                          marginBottom: 16,
                        }}
                      >
                        {act.biomechanics && (
                          <div>
                            <Label>Biomechanics</Label>
                            <div
                              style={{
                                display: "grid",
                                gridTemplateColumns: "1fr 1fr",
                                gap: 8,
                              }}
                            >
                              {[
                                act.biomechanics.cadence_spm && {
                                  k: "Cadence",
                                  v: `${act.biomechanics.cadence_spm} spm`,
                                  good:
                                    act.biomechanics.cadence_spm >= 178 &&
                                    act.biomechanics.cadence_spm <= 185,
                                  tip: "Higher cadence reduces ground impact. Ideal: 178–185 spm.",
                                },
                                act.biomechanics.ground_contact_ms && {
                                  k: "Gnd Contact",
                                  v: `${act.biomechanics.ground_contact_ms} ms`,
                                  good:
                                    act.biomechanics.ground_contact_ms < 230,
                                  tip: "Time foot spends on ground. Lower = more elastic energy return. Target: < 230ms.",
                                },
                                act.biomechanics.vertical_oscillation_cm && {
                                  k: "Vert. Osc.",
                                  v: `${act.biomechanics.vertical_oscillation_cm} cm`,
                                  good:
                                    act.biomechanics.vertical_oscillation_cm <
                                    8.5,
                                  tip: "How much you bounce vertically. Less = more forward propulsion. Aim < 8.5cm.",
                                },
                                act.biomechanics.power_w && {
                                  k: "Power",
                                  v: `${act.biomechanics.power_w} W`,
                                  good: true,
                                  tip: "Running power — best metric for consistent effort on variable terrain.",
                                },
                              ]
                                .filter(Boolean)
                                .map(({ k, v, good, tip }) => (
                                  <Tip
                                    key={k}
                                    width={210}
                                    content={
                                      <div>
                                        <div

                                            display: "flex",

                                          <span
                                            style={{
                                              fontWeight: 600,

                                          <span
                                            style={{
                                              fontSize: 11,
                                              color: good
                                                ? "#5a8a62"
                                                : "#b8673e",
                                              fontWeight: 600,
                                            }}
                                          >
                                            {good ? "✓ Good" : "⚠ Watch"}
                                          </span>
                                        </div>
                                        <div
                                          style={{
                                            fontSize: 11,
                                            color: t.textMid,
                                            lineHeight: 1.5,
                                          }}
                                        >
                                          {tip}
                                        </div>
                                      </div>
                                    }
                                  >

                                          style={{
                                            fontSize: 11,
                                            color: t.textMuted,

                                          {k}
                                        </div>

                                          style={{

                                            height: 6,
                                            borderRadius: "50%",
                                            background: good
                                              ? "#5a8a62"
                                              : "#b8673e",

                                        />
                                      </div>
                                      <div
                                        style={{
                                          fontSize: 15,
                                          fontWeight: 600,
                                        }}
                                      >
                                        {v}
                                      </div>
                                    </div>
                                  </Tip>

                              fontSize: 14,
                              color: t.textMid,
                              lineHeight: 1.7,

                            {act.coach_analysis}
                          </div>

                            <div
                              style={{
                                borderTop: `1px solid ${t.borderSoft}`,
                                paddingTop: 10,
                                display: "flex",
                                flexDirection: "column",
                                gap: 5,
                              }}
                            >

                                    color: t.textMuted,

      // ── Coach Chat ───────────────────────────────────────────────────
      function CoachChat({ coach, mini = false }) {
        const { t, ac } = useTh();
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const [fetching, setFetching] = useState(true);
        const bottomRef = useRef(null);
        const scrollContainerRef = useRef(null);
        const didInitialScroll = useRef(false);
        const cd = COACH_META[coach] || COACH_META.classic;

        const CHIPS = [
          "How should I pace today's run?",
          "Am I recovered enough to train hard?",
          "What should I focus on this week?",
        ];

        useEffect(() => {
          apiFetch("/api/chat/history")
            .then((r) => r?.json())
            .then((d) => {
              if (d?.messages) setMessages(d.messages);
            })
            .finally(() => setFetching(false));
        }, []);

        useLayoutEffect(() => {
          if (!scrollContainerRef.current || !messages.length) return;
          if (!didInitialScroll.current) {
            scrollContainerRef.current.scrollTop =
              scrollContainerRef.current.scrollHeight;
            didInitialScroll.current = true;
          } else {
            bottomRef.current?.scrollIntoView({ behavior: "smooth" });
          }
        }, [messages]);

        async function send(text) {
          if (!text.trim() || loading) return;
          const userMsg = {
            role: "user",
            content: text,
            timestamp: new Date().toISOString(),
            source: "web",
          };
          setMessages((m) => [...m, userMsg]);
          setInput("");
          setLoading(true);
          try {
            const r = await apiFetch("/api/chat/message", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: text, coach_key: coach }),
            });
            const d = await r?.json();
            if (d?.response)
              setMessages((m) => [
                ...m,
                {
                  role: "assistant",
                  content: d.response,
                  timestamp: d.timestamp,
                  source: "web",
                },
              ]);
            else if (d?.error)
              setMessages((m) => [
                ...m,
                {
                  role: "assistant",
                  content: `⚠ ${d.error}`,
                  timestamp: new Date().toISOString(),
                  source: "web",
                },
              ]);
          } finally {
            setLoading(false);
          }
        }

        const ts = (time) => {
          try {
            return new Date(time).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
            });
          } catch {
            return "";
          }
        };

        return (
          <div
            style={{
              display: "flex",
              flexDirection: "column",
              height: "100%",
              color: t.text,
              animation: mini ? "none" : "fadeUp 0.3s ease",
            }}
          >
            {!mini && (
              <div
                style={{
                  padding: "20px 28px 16px",
                  borderBottom: `1px solid ${t.border}`,
                  display: "flex",
                  gap: 14,
                  alignItems: "center",
                  flexShrink: 0,
                }}
              >
                <div
                  style={{
                    width: 42,
                    height: 42,
                    borderRadius: 12,
                    background: cd.color,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    fontWeight: 700,
                    fontSize: 17,
                    color: "#fff",
                  }}
                >
                  {cd.initials}
                </div>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 16 }}>{cd.name}</div>
                  <div
                    style={{
                      fontSize: 12,
                      color: "#5a8a62",
                      display: "flex",
                      gap: 7,
                      alignItems: "center",
                      marginTop: 2,
                    }}
                  >
                    <span
                      style={{
                        width: 7,
                        height: 7,
                        borderRadius: "50%",
                        background: "#5a8a62",
                        display: "inline-block",
                        animation: "pulse 2s infinite",
                      }}
                    />
                    Online · {cd.style}
                  </div>
                </div>
              </div>
            )}

            <div
              ref={scrollContainerRef}
              style={{
                flex: 1,
                overflowY: "auto",
                overflowX: "hidden",
                padding: mini ? "12px 14px" : "22px 28px",
                display: "flex",
                flexDirection: "column",
                gap: 12,
              }}
            >
              {fetching && (
                <div
                  style={{
                    color: t.textMuted,
                    textAlign: "center",
                    fontSize: 13,
                  }}
                >
                  Loading history…
                </div>
              )}
              {!fetching && messages.length === 0 && (
                <div
                  style={{
                    textAlign: "center",
                    color: t.textMuted,
                    marginTop: mini ? 16 : 40,
                  }}
                >
                  <div
                    style={{
                      width: mini ? 36 : 48,
                      height: mini ? 36 : 48,
                      borderRadius: 12,
                      background: cd.color,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontWeight: 700,
                      fontSize: mini ? 14 : 18,
                      color: "#fff",
                      margin: "0 auto 12px",
                    }}
                  >
                    {cd.initials}
                  </div>
                  <div style={{ fontSize: mini ? 13 : 15, fontWeight: 600 }}>
                    Chat with {cd.name}
                  </div>
                </div>
              )}
              {messages.map((msg, i) => (
                <div
                  key={i}
                  style={{
                    display: "flex",
                    flexDirection: msg.role === "user" ? "row-reverse" : "row",
                    gap: 8,
                    alignItems: "flex-end",
                  }}
                >
                  {msg.role === "assistant" && (
                    <div
                      style={{
                        width: 26,
                        height: 26,
                        borderRadius: 8,
                        background: cd.color,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontWeight: 700,
                        fontSize: 10,
                        color: "#fff",
                        flexShrink: 0,
                      }}
                    >
                      {cd.initials}
                    </div>
                  )}
                  <div style={{ maxWidth: "72%" }}>
                    <div
                      style={{
                        background: msg.role === "user" ? ac.main : t.surface2,
                        color: msg.role === "user" ? "#fff" : t.textMid,
                        borderRadius:
                          msg.role === "user"
                            ? "14px 14px 4px 14px"
                            : "14px 14px 14px 4px",
                        padding: mini ? "9px 12px" : "11px 15px",
                        fontSize: mini ? 13 : 14,
                        lineHeight: 1.65,
                      }}
                    >
                      {msg.content}
                    </div>
                    <div
                      style={{
                        fontSize: 10,
                        color: t.textDim,
                        marginTop: 3,
                        textAlign: msg.role === "user" ? "right" : "left",
                      }}
                    >
                      {ts(msg.timestamp)}
                      {msg.source === "slack" ? " · Slack" : ""}
                    </div>
                  </div>
                </div>
              ))}
              {loading && (
                <div
                  style={{ display: "flex", gap: 8, alignItems: "flex-end" }}
                >
                  <div
                    style={{
                      width: 26,
                      height: 26,
                      borderRadius: 8,
                      background: cd.color,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontWeight: 700,
                      fontSize: 10,
                      color: "#fff",
                      flexShrink: 0,
                    }}
                  >
                    {cd.initials}
                  </div>
                  <div
                    style={{
                      background: t.surface2,
                      borderRadius: "14px 14px 14px 4px",
                      padding: "11px 14px",
                    }}
                  >
                    <div style={{ display: "flex", gap: 5 }}>
                      {[0, 1, 2].map((i) => (
                        <div
                          key={i}
                          style={{
                            width: 5,
                            height: 5,
                            borderRadius: "50%",
                            background: t.textMuted,
                            animation: `pulse 1.2s ${i * 0.2}s infinite`,
                          }}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              )}
              <div ref={bottomRef} />
            </div>

            {!mini && messages.length < 2 && (
              <div
                style={{
                  padding: "0 28px 12px",
                  display: "flex",
                  gap: 8,
                  flexWrap: "wrap",
                  flexShrink: 0,
                }}
              >
                {CHIPS.map((c) => (
                  <button
                    key={c}
                    onClick={() => send(c)}
                    style={{
                      background: t.surface2,
                      border: `1px solid ${t.border}`,
                      borderRadius: 20,
                      padding: "6px 13px",
                      fontSize: 12,
                      color: t.textMuted,
                      cursor: "pointer",
                    }}
                  >
                    {c}
                  </button>
                ))}
              </div>
            )}

            <div
              style={{
                padding: mini ? "8px 12px" : "0 28px 26px",
                flexShrink: 0,
              }}
            >
              <div
                style={{
                  display: "flex",
                  gap: 8,
                  background: t.surface2,
                  border: `1px solid ${t.border}`,
                  borderRadius: 13,
                  padding: "8px 8px 8px 14px",
                  alignItems: "center",
                }}
              >
                <input
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) =>
                    e.key === "Enter" &&
                    !e.shiftKey &&
                    (e.preventDefault(), send(input))
                  }
                  placeholder={`Message ${cd.name}…`}
                  style={{
                    flex: 1,
                    background: "transparent",
                    border: "none",
                    outline: "none",
                    color: t.text,
                    fontSize: mini ? 13 : 14,
                  }}
                />
                <button
                  onClick={() => send(input)}
                  disabled={!input.trim() || loading}
                  style={{
                    width: 34,
                    height: 34,
                    borderRadius: 9,
                    border: "none",
                    background: input.trim() && !loading ? ac.main : t.border,
                    cursor: input.trim() && !loading ? "pointer" : "default",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    flexShrink: 0,
                    transition: "background 0.15s",
                  }}
                >
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path
                      d="M1 13L13 7 1 1v4.5l8 1.5-8 1.5V13z"
                      fill={input.trim() && !loading ? "#fff" : t.textDim}
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ── Weekly Review ────────────────────────────────────────────────
      function WeeklyReview() {

        const windowWidth = useWindowWidth();
        const chartWidth =
          windowWidth < 768
            ? Math.max(120, Math.floor((windowWidth - 56) / 2))
            : 280;
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [reviewOffset, setReviewOffset] = useState(0);

        useEffect(() => {
          setLoading(true);
          apiFetch(`/api/review?offset=${reviewOffset}`)
            .then((r) => r?.json())
            .then((d) => {
              if (d && !d.error) setData(d);
              else setData(null);
            })
            .finally(() => setLoading(false));
        }, [reviewOffset]);

        if (loading)
          return (
            <div
              style={{
                padding: 40,
                color: t.textMuted,
                animation: "fadeUp 0.3s ease",

              Loading weekly review…

          return (
            <EmptyState

              title="No weekly review yet"

          data;

        return (
          <div

              overflowY: "auto",
              height: "100%",
              padding: "28px 32px",

            <div

                display: "flex",
                justifyContent: "space-between",

                    fontSize: 26,
                    fontWeight: 600,
                    letterSpacing: "-0.02em",

                >
                  Weekly Review

                    borderRadius: 8,
                    padding: "6px 12px",

                    color: t.text,

      // ── Admin ────────────────────────────────────────────────────────
      function Admin() {
        const { t, ac } = useTh();
        const [data, setData] = useState(null);
        const [category, setCategory] = useState("all");
        const [severity, setSeverity] = useState("all");
        const [offset, setOffset] = useState(0);
        const [loading, setLoading] = useState(true);

        const LIMIT = 50;
        const CATS = ["all", "auth", "garmin", "claude", "scheduler", "http"];
        const SEVS = ["all", "info", "warn", "error"];
        const SEV_COLORS = {
          info: t.textMuted,
          warn: "#e67e22",
          error: "#e74c3c",
        };

        function load(cat, sev, off) {
          setLoading(true);
          apiFetch(
            `/api/admin/events?category=${cat}&severity=${sev}&limit=${LIMIT}&offset=${off}`,
          )
            .then((r) => r?.json())
            .then((d) => {
              if (d) setData(d);
            })
            .finally(() => setLoading(false));
        }
        useEffect(() => {
          load(category, severity, 0);
          setOffset(0);
        }, [category, severity]);

        return (
          <div
            style={{
              overflowY: "auto",
              height: "100%",
              padding: "28px 32px",
              animation: "fadeUp 0.3s ease",
              color: t.text,
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                marginBottom: 20,
              }}
            >
              <div
                style={{
                  fontSize: 24,
                  fontWeight: 600,
                  letterSpacing: "-0.02em",
                }}
              >
                Event Log
              </div>
              <button
                onClick={() => load(category, severity, 0)}
                style={{
                  padding: "6px 14px",
                  background: "none",
                  border: `1px solid ${t.border}`,
                  borderRadius: 7,
                  cursor: "pointer",
                  fontSize: 13,
                  color: t.text,
                }}
              >
                ↺ Refresh
              </button>
            </div>
            <div style={{ display: "flex", gap: 16, marginBottom: 16 }}>
              <div style={{ display: "flex", gap: 4 }}>
                {CATS.map((c) => (
                  <button
                    key={c}
                    onClick={() => setCategory(c)}
                    style={{
                      padding: "5px 10px",
                      borderRadius: 6,
                      cursor: "pointer",
                      fontSize: 12,
                      background: category === c ? ac.main : t.surface,
                      color: category === c ? "#fff" : t.text,
                      border: `1px solid ${category === c ? ac.main : t.border}`,
                    }}
                  >
                    {c}
                  </button>
                ))}
